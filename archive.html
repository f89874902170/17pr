<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>BloodMine - В разработке</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(100deg, #1a0d04 5%, #331a0d 100%); 
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(255, 100, 0, 0.3);
      border: 2px solid #ff7f00;
    }
    h1 {
      font-size: 6em; /* Больше! */
      margin: 0;
      background: linear-gradient(100deg, #f01a00 5%, #ffb400 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 10px rgba(255, 100, 0, 0.5);
    }
    p {
      font-size: 1.3em; 
      margin-top: 20px;
      color: #ffe0b2; 
      font-weight: bold;
    }
    a {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 30px;
      background: linear-gradient(100deg, #f01a00 5%, #ffb400 100%);
      color: #fff7e8;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 5px 25px rgba(233, 65, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(233, 65, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BloodMine</h1>
    <p>эта страничка еще не реализована</p>
    <a href="index.html">Главная</a>
  </div>
</body>
</html>
